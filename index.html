<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050607" />
    <meta name="description" content="TRW — private exchange coming soon" />
    <title>TRW — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #050607;
        --white: #f5f7f2;
        --muted: rgba(255,255,255,.42);
        --line: rgba(255,255,255,.14);
        --green: #9be6c2;
        --mono: "IBM Plex Mono", monospace;
        --display: "Space Grotesk", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--white); font-family: var(--mono); }

      .page {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100svh;
        overflow: hidden;
        place-items: center;
        background: radial-gradient(circle at 50% 35%, rgba(98,116,124,.12), transparent 28rem), radial-gradient(circle at 10% 95%, rgba(55,130,113,.12), transparent 23rem), var(--bg);
      }

      .page::before {
        position: absolute;
        inset: 0;
        z-index: -2;
        background-image: linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.026) 1px, transparent 1px);
        background-size: 56px 56px;
        content: "";
        mask-image: linear-gradient(to bottom, transparent, black 20%, black 75%, transparent);
      }

      .ambient { position: absolute; z-index: -1; width: 26rem; height: 26rem; border-radius: 50%; filter: blur(80px); opacity: .2; pointer-events: none; animation: float 12s ease-in-out infinite alternate; }
      .ambient.one { top: -10rem; right: -7rem; background: #9bb9c2; }
      .ambient.two { bottom: -12rem; left: -8rem; background: #1a806d; animation-delay: -5s; }

      .grid-floor { position: absolute; right: -10%; bottom: -32%; left: -10%; z-index: -1; height: 55%; opacity: .18; transform: perspective(400px) rotateX(58deg); transform-origin: bottom; background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px); background-size: 52px 38px; mask-image: linear-gradient(to top, black, transparent 80%); animation: grid-drift 18s linear infinite; }

      .ticker { position: absolute; z-index: 0; display: flex; gap: .55rem; align-items: center; padding: .55rem .8rem; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(255,255,255,.045); box-shadow: inset 0 1px rgba(255,255,255,.08), 0 1rem 3rem rgba(0,0,0,.14); backdrop-filter: blur(12px); color: rgba(255,255,255,.55); font-size: .52rem; letter-spacing: .11em; animation: ticker-float 6s ease-in-out infinite; }
      .ticker b { color: var(--green); font-weight: 400; }
      .ticker.one { top: 22%; left: 7%; }
      .ticker.two { right: 8%; bottom: 23%; animation-delay: -2.8s; }

      .noise { position: absolute; inset: 0; z-index: 8; opacity: .025; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E"); }

      .card { position: relative; width: min(88vw, 58rem); min-height: min(70vh, 34rem); padding: clamp(2rem, 5vw, 4.5rem); overflow: hidden; border: 1px solid rgba(255,255,255,.18); border-radius: 1.75rem; background: linear-gradient(135deg, rgba(255,255,255,.1), rgba(255,255,255,.025) 55%, rgba(106,174,161,.06)); box-shadow: 0 2rem 6rem rgba(0,0,0,.36), inset 0 1px rgba(255,255,255,.17), inset 0 -1px rgba(255,255,255,.04); backdrop-filter: blur(22px) saturate(125%); animation: breathe 7s ease-in-out infinite; }
      .card::before { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.035); content: ""; pointer-events: none; }
      .card::after { position: absolute; top: -50%; left: -25%; width: 70%; height: 200%; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.075) 50%, transparent 65%); transform: rotate(14deg); animation: sweep 9s ease-in-out infinite; content: ""; pointer-events: none; }
      .reflection { position: absolute; top: 0; right: 0; left: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); opacity: .55; }

      .content { position: relative; z-index: 3; width: 100%; transform: translateY(-1rem); text-align: center; }
      .market-label { display: flex; justify-content: space-between; width: min(100%, 32rem); margin: 0 auto 3.4rem; color: rgba(255,255,255,.38); font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; }
      .market-index { display: inline-flex; align-items: center; gap: .5rem; color: rgba(255,255,255,.72); }
      .live-dot, .status-dot { display: inline-block; width: .34rem; height: .34rem; border-radius: 50%; background: var(--green); box-shadow: 0 0 14px rgba(155,230,194,.9); animation: pulse 1.8s ease-in-out infinite; }
      .prompt { display: flex; align-items: center; gap: .65rem; width: min(100%, 32rem); margin: 0 auto 1.1rem; color: var(--muted); font-size: clamp(.62rem,1.5vw,.75rem); letter-spacing: .22em; text-align: left; text-transform: uppercase; }
      .prompt-mark { color: rgba(214,245,230,.82); }
      .prompt-time { margin-left: auto; color: rgba(255,255,255,.2); font-size: .56rem; letter-spacing: .08em; }
      h1 { display: flex; min-height: 1.2em; align-items: baseline; justify-content: center; margin: 0; color: var(--white); font-family: var(--display); font-size: clamp(2rem,7vw,5.1rem); font-weight: 400; letter-spacing: -.08em; line-height: 1; text-shadow: 0 0 30px rgba(219,255,239,.12); }
      .caret { display: inline-block; width: .065em; height: .86em; margin-left: .14em; background: #e6fff2; box-shadow: 0 0 16px rgba(178,255,215,.75); transform: translateY(.05em); animation: blink .85s steps(1,end) infinite; }

      .exchange { display: flex; align-items: center; justify-content: center; gap: .7rem; margin-top: 2rem; color: rgba(255,255,255,.68); font-size: .62rem; letter-spacing: .16em; }
      .currency { padding: .35rem .55rem; border: 1px solid rgba(255,255,255,.14); border-radius: .45rem; background: rgba(255,255,255,.055); box-shadow: inset 0 1px rgba(255,255,255,.08); animation: quote 3.5s ease-in-out infinite; }
      .currency:nth-of-type(3) { animation-delay: 1.3s; }
      .arrow { color: #b7e9d0; font-size: .9rem; animation: arrow 2.2s ease-in-out infinite; }
      .rate { margin-left: .7rem; color: rgba(255,255,255,.36); font-size: .54rem; letter-spacing: .12em; }
      .trend { margin-right: .25rem; color: var(--green); }
      .wave { display: flex; height: 1.4rem; align-items: end; justify-content: center; gap: .19rem; margin-top: 1.5rem; opacity: .48; }
      .wave span { width: .18rem; height: 35%; border-radius: 999px; background: linear-gradient(to top, rgba(155,230,194,.2), var(--green)); transform-origin: bottom; animation: wave 1.55s ease-in-out infinite; }
      .wave span:nth-child(2n) { animation-delay: -.55s; } .wave span:nth-child(3n) { animation-delay: -.9s; } .wave span:nth-child(4n) { animation-delay: -.2s; } .wave span:nth-child(1), .wave span:nth-child(7), .wave span:nth-child(13) { height: 70%; } .wave span:nth-child(4), .wave span:nth-child(10) { height: 55%; }

      .footer { position: absolute; right: clamp(2rem,5vw,4.5rem); bottom: clamp(1.5rem,4vw,2.5rem); left: clamp(2rem,5vw,4.5rem); z-index: 3; display: flex; justify-content: space-between; color: rgba(255,255,255,.28); font-size: .52rem; letter-spacing: .1em; text-transform: uppercase; }
      .footer strong { color: var(--green); font-weight: 400; }
      .status { position: absolute; right: clamp(2rem,7vw,6rem); bottom: clamp(1.8rem,5vw,3.5rem); display: flex; align-items: center; gap: .6rem; margin: 0; color: rgba(255,255,255,.24); font-size: .58rem; letter-spacing: .12em; text-transform: uppercase; }
      .status-dot { background: rgba(255,255,255,.65); box-shadow: 0 0 10px rgba(255,255,255,.4); }

      @keyframes float { from { transform: translate3d(-1rem,1rem,0) scale(.95); } to { transform: translate3d(1rem,-1rem,0) scale(1.05); } }
      @keyframes grid-drift { from { background-position: 0 0; } to { background-position: 0 38px; } }
      @keyframes ticker-float { 0%,100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(.5rem,-.7rem,0); } }
      @keyframes sweep { 0%,42% { transform: translateX(-18%) rotate(14deg); opacity: 0; } 58% { opacity: 1; } 82%,100% { transform: translateX(180%) rotate(14deg); opacity: 0; } }
      @keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes blink { 0%,45% { opacity: 1; } 46%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .4; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes arrow { 0%,100% { transform: translateX(0); opacity: .65; } 50% { transform: translateX(4px); opacity: 1; } }
      @keyframes quote { 0%,100% { border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.055); } 16% { border-color: rgba(155,230,194,.5); background: rgba(155,230,194,.11); } 28% { border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.055); } }
      @keyframes wave { 0%,100% { transform: scaleY(.55); opacity: .45; } 50% { transform: scaleY(1.25); opacity: 1; } }

      @media (max-width: 640px) {
        .card { width: min(92vw, 58rem); min-height: 66vh; padding: 2rem 1.25rem; border-radius: 1.25rem; }
        .market-label { margin-bottom: 3rem; }
        .prompt-time, .market-name { display: none; }
        h1 { font-size: clamp(1.85rem,10vw,3.4rem); letter-spacing: -.1em; }
        .ticker { font-size: .46rem; transform: scale(.9); }
        .ticker.one { top: 12%; left: 3%; } .ticker.two { right: 3%; bottom: 12%; }
        .exchange { gap: .5rem; font-size: .56rem; } .rate { margin-left: .25rem; font-size: .48rem; }
        .footer { flex-direction: column; gap: .45rem; }
        .status { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ambient, .grid-floor, .card, .card::after, .ticker, .caret, .live-dot, .status-dot, .arrow, .currency, .wave span { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-label="TRW coming soon">
      <div class="ambient one" aria-hidden="true"></div><div class="ambient two" aria-hidden="true"></div><div class="grid-floor" aria-hidden="true"></div>
      <div class="ticker one" aria-hidden="true"><span>USD</span><b>+0.24%</b></div><div class="ticker two" aria-hidden="true"><span>USDT</span><b>1.0000</b></div><div class="noise" aria-hidden="true"></div>
      <section class="card">
        <div class="reflection" aria-hidden="true"></div>
        <div class="content" aria-live="polite">
          <div class="market-label"><span class="market-index"><i class="live-dot"></i> FX / 01</span><span class="market-name">private exchange</span></div>
          <p class="prompt"><span class="prompt-mark">&gt;</span><span>trw terminal</span><span class="prompt-time">21:40:08</span></p>
          <h1><span id="typed-text"></span><span class="caret" aria-hidden="true"></span></h1>
          <div class="exchange" aria-hidden="true"><span class="currency">USD</span><span class="arrow">⇄</span><span class="currency">USDT</span><span class="rate"><span class="trend">↗</span> rate 1.0000</span></div>
          <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </div>
        <div class="footer" aria-hidden="true"><span>secure channel / encrypted</span><span>market status <strong>online</strong></span></div>
      </section>
      <p class="status" aria-hidden="true"><span class="status-dot"></span> connection pending</p>
    </main>
    <script>
      const text = "TRW coming soon";
      const target = document.getElementById("typed-text");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let index = 0, deleting = false, timer;
      function type() {
        if (!deleting) { index++; target.textContent = text.slice(0, index); if (index === text.length) { deleting = true; timer = setTimeout(type, 1900); return; } }
        else { index--; target.textContent = text.slice(0, index); if (index === 0) { deleting = false; timer = setTimeout(type, 440); return; } }
        timer = setTimeout(type, deleting ? 56 : 98);
      }
      if (reduced) target.textContent = text; else timer = setTimeout(type, 380);
      window.addEventListener("beforeunload", () => clearTimeout(timer));
    </script>
  </body>
</html>
